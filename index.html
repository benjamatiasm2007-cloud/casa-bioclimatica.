<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Casa Bioclimática Neuquén</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: escena 3D a pantalla completa; panel inferior con vistas, capas y sol; título y brújula arriba. */
:root{
  --bg:#dfe9e2; --fg:#1b2a22; --muted:#55645b; --panel:rgba(249,251,247,.93);
  --line:#c8d4cb; --chip:#e6ede4; --accent:#c5701a; --accent-fg:#ffffff; --wind:#1d7a8c;
  --display:"Space Grotesk","Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101612; --fg:#e8efe8; --muted:#9fb2a5; --panel:rgba(21,29,24,.93);
    --line:#34443b; --chip:#222f27; --accent:#f0a24a; --accent-fg:#1b1207; --wind:#5cc0d3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101612; --fg:#e8efe8; --muted:#9fb2a5; --panel:rgba(21,29,24,.93);
  --line:#34443b; --chip:#222f27; --accent:#f0a24a; --accent-fg:#1b1207; --wind:#5cc0d3; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:600 11px/1 var(--body);
  padding:4px 7px;border-radius:6px;background:rgba(20,28,23,.78);color:#fff;letter-spacing:.01em}
.lbl.out{background:rgba(197,112,26,.92)}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0;backdrop-filter:blur(8px)}
.title b{display:block;font:700 15px/1.2 var(--display)}
.title span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.compass{pointer-events:auto;width:52px;height:52px;flex:none;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.compass svg{width:40px;height:40px;transition:transform .05s linear}
.dock{pointer-events:auto;width:100%;max-width:760px;margin-inline:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(10px);box-sizing:border-box}
.info h2{margin:0;font:700 15px/1.25 var(--display)}
.info p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.45;max-height:6.2em;overflow:auto;text-wrap:pretty}
.row{display:flex;gap:7px;align-items:center}
.views{overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.views::-webkit-scrollbar{display:none}
.tools{flex-wrap:wrap}
.chip{flex:none;font:500 13px/1 var(--body);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:999px;
  padding:8px 12px;cursor:pointer;touch-action:manipulation}
.chip:focus-visible,.grab:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.chip.wind.on{background:var(--wind);border-color:var(--wind);color:#fff}
.chip.big{font-weight:600;padding:9px 16px}
.lab{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);flex:none}
.sun{flex-wrap:wrap}
.sun .seg{display:flex;gap:6px}
.hour{display:flex;align-items:center;gap:8px;flex:1 1 170px;min-width:150px}
.hour input{flex:1;min-width:0;accent-color:var(--accent)}
.hour output{font:600 13px/1 var(--body);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.power{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pwhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pw{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:8px 10px;min-width:0}
.pw.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pw .k{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw .v{font:700 20px/1.1 var(--display);margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pw .v small{font:500 12px var(--body);color:var(--muted);margin-left:3px}
.pw .bar{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.pw .bar i{display:block;height:100%;width:0;background:var(--accent)}
.pw .d{font-size:11px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.grab{align-self:center;background:none;border:0;color:var(--muted);font:500 12px/1 var(--body);padding:2px 10px 4px;cursor:pointer}
.collapsed .info,.collapsed .views,.collapsed .sun{display:none}
#err{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:24px;background:var(--bg);color:var(--fg)}
@media (prefers-reduced-motion: reduce){.compass svg{transition:none}}
</style>

<div id="stage" aria-label="Maqueta 3D de la vivienda bioclimática"></div>
<div id="labels"></div>
<div id="err"><p>No se pudo iniciar el visor 3D en este dispositivo. Probá abrir la página en otro navegador.</p></div>

<div id="ui">
  <header class="top">
    <div class="title"><b>Casa bioclimática</b><span>Neuquén Capital · zona IVb · frente al Norte</span></div>
    <div class="compass" title="Norte"><svg id="needle" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="none" stroke="var(--line)" stroke-width="1.5"/>
      <path d="M20 4 L25 20 L20 17 L15 20 Z" fill="var(--accent)"/>
      <path d="M20 36 L25 20 L20 23 L15 20 Z" fill="var(--muted)" opacity=".55"/>
      <text x="20" y="14.5" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="Inter,sans-serif">N</text>
    </svg></div>
  </header>

  <section class="dock" id="dock">
    <button class="grab" id="grab" aria-expanded="true">Ocultar panel ⌄</button>
    <div class="info"><h2 id="infoT"></h2><p id="infoP"></p></div>
    <div class="row views" id="views" role="group" aria-label="Vistas"></div>
    <div class="row tools" id="tools" role="group" aria-label="Capas"></div>
    <div class="row sun" role="group" aria-label="Sol">
      <span class="lab">Sol</span>
      <div class="seg" id="seasons"></div>
      <label class="hour"><input id="hour" type="range" min="4" max="20" step="0.25" value="12" aria-label="Hora solar"><output id="hourOut">12:00</output></label>
      <button class="chip" id="play" type="button" aria-pressed="false">Reproducir día</button>
    </div>
    <div class="pwhead"><span class="lab">Potencia solar generada</span><span class="lab" id="pwTime"></span></div>
    <div class="power" id="power"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function(){
"use strict";
var T=THREE;
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var stage=document.getElementById('stage');
var renderer;
try{
  renderer=new T.WebGLRenderer({antialias:true});
}catch(e){document.getElementById('err').style.display='grid';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

var scene=new T.Scene();
var fogCol=new T.Color(0xcfe3ef);
scene.fog=new T.Fog(fogCol,90,430);
var camera=new T.PerspectiveCamera(48,1,0.1,900);
var controls=new T.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=0.3;controls.maxDistance=140;
controls.maxPolarAngle=Math.PI/2-0.015;
controls.screenSpacePanning=true;

// Convención de la escena: Norte = +Z, Este = -X, Oeste = +X, arriba = +Y.
var seed=11;
function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function smooth(a,b,v){var k=clamp((v-a)/(b-a),0,1);return k*k*(3-2*k);}

/* ---------- Luces y cielo ---------- */
var hemi=new T.HemisphereLight(0xdcecff,0x7d8a6a,0.75);scene.add(hemi);
var amb=new T.AmbientLight(0xffffff,0.28);scene.add(amb);
var sunLight=new T.DirectionalLight(0xfff1d6,1.15);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(2048,2048);
var sc=sunLight.shadow.camera;sc.left=-24;sc.right=24;sc.top=24;sc.bottom=-24;sc.near=1;sc.far=220;
sunLight.shadow.bias=-0.0006;
scene.add(sunLight);scene.add(sunLight.target);

var skyMat=new T.ShaderMaterial({
  side:T.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new T.Color(0x3f86c9)},bot:{value:new T.Color(0xcfe3ef)}},
  vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying float h;void main(){float k=pow(clamp(h,0.0,1.0),0.55);gl_FragColor=vec4(mix(bot,top,k),1.0);}'
});
var sky=new T.Mesh(new T.SphereGeometry(700,24,16),skyMat);sky.renderOrder=-1;scene.add(sky);
var sunBall=new T.Mesh(new T.SphereGeometry(3,16,12),new T.MeshBasicMaterial({color:0xffe08a,fog:false}));
scene.add(sunBall);

/* ---------- Terreno ---------- */
var LAKE={x:-50,z:46};
function baseH(x,z){
  var r=Math.hypot(x,z);
  var k=smooth(18,80,r);
  var n=Math.sin(x*0.045)*Math.cos(z*0.038)*3.2+Math.sin(x*0.11+1.3)*Math.sin(z*0.09)*1.1+Math.sin(x*0.02+z*0.027)*4.5;
  return n*k;
}
function groundY(x,z){
  var d=Math.hypot(x-LAKE.x,z-LAKE.z);
  return baseH(x,z)-4.5*Math.exp(-d*d/(2*9*9));
}
(function terrain(){
  var g=new T.PlaneGeometry(760,760,170,170);g.rotateX(-Math.PI/2);
  var p=g.attributes.position,cols=new Float32Array(p.count*3);
  var c1=new T.Color(0x78a24f),c2=new T.Color(0x5f8a44),c3=new T.Color(0x9a9a5c),c4=new T.Color(0xc9bd8c),c=new T.Color();
  for(var i=0;i<p.count;i++){
    var x=p.getX(i),z=p.getZ(i),y=groundY(x,z);p.setY(i,y);
    var n=(Math.sin(x*0.3)*Math.sin(z*0.27)+Math.sin(x*0.07+z*0.05))*0.25+0.5;
    c.copy(c2).lerp(c1,clamp(n,0,1));
    c.lerp(c3,smooth(30,10,-y)*0.0+clamp((Math.hypot(x,z)-90)/200,0,0.55));
    var dl=Math.hypot(x-LAKE.x,z-LAKE.z);
    if(dl<14)c.lerp(c4,smooth(14,8,dl));
    cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;
  }
  g.setAttribute('color',new T.BufferAttribute(cols,3));
  g.computeVertexNormals();
  var m=new T.Mesh(g,new T.MeshLambertMaterial({vertexColors:true}));
  m.receiveShadow=true;scene.add(m);
  var wy=baseH(LAKE.x,LAKE.z)-2.0;
  var w=new T.Mesh(new T.CircleGeometry(22,40),new T.MeshStandardMaterial({color:0x3f87a6,transparent:true,opacity:0.82,roughness:0.15,metalness:0.1}));
  w.rotation.x=-Math.PI/2;w.position.set(LAKE.x,wy,LAKE.z);scene.add(w);
})();

/* ---------- Montañas ---------- */
(function mountains(){
  var rock=[0x6b7a8c,0x7b8794,0x5e6b78,0x71808f];
  function peak(x,z,r,h,col,snow){
    var g=new T.ConeGeometry(r,h,8,3,true),p=g.attributes.position;
    for(var i=0;i<p.count;i++){
      var y=p.getY(i);
      if(y<h/2-0.01){p.setX(i,p.getX(i)+(rnd()-0.5)*r*0.28);p.setZ(i,p.getZ(i)+(rnd()-0.5)*r*0.28);p.setY(i,y+(rnd()-0.5)*h*0.05);}
    }
    g.computeVertexNormals();
    var m=new T.Mesh(g,new T.MeshLambertMaterial({color:col,flatShading:true}));
    m.position.set(x,h/2-8,z);scene.add(m);
    if(snow){
      var hs=h*0.34;
      var s=new T.Mesh(new T.ConeGeometry(r*0.37,hs,8,1,true),new T.MeshLambertMaterial({color:0xf2f6fa,flatShading:true}));
      s.position.set(x,h-8-hs/2+0.4,z);scene.add(s);
    }
  }
  var N=24,i,a,rad,h,x,z;
  for(i=0;i<N;i++){
    a=i*(2*Math.PI/N)+(rnd()-0.5)*0.15;rad=250+rnd()*70;
    x=Math.sin(a)*rad;z=Math.cos(a)*rad;
    h=48+rnd()*52;h*=1+0.55*Math.max(0,-z/rad);
    peak(x,z,62+rnd()*34,h,rock[i%4],h>62);
  }
  for(i=0;i<16;i++){
    a=rnd()*Math.PI*2;rad=165+rnd()*40;
    peak(Math.sin(a)*rad,Math.cos(a)*rad,42+rnd()*24,14+rnd()*16,i%3===0?0x7b7f66:0x667f4c,false);
  }
})();

/* ---------- Árboles ---------- */
var treeShadowR=27;
function mkPine(x,z,s){
  var g=new T.Group(),y=groundY(x,z);
  var col=new T.Color(0x2f5d3a).offsetHSL((rnd()-0.5)*0.03,0,(rnd()-0.5)*0.06);
  var tm=new T.MeshLambertMaterial({color:0x5b3f2a}),fm=new T.MeshLambertMaterial({color:col,flatShading:true});
  var t=new T.Mesh(new T.CylinderGeometry(0.12*s,0.18*s,1.4*s,6),tm);t.position.y=0.7*s;g.add(t);
  var rs=[1.55,1.2,0.82],hs=[2.5,2.1,1.8],ys=[2.1,3.3,4.3];
  for(var i=0;i<3;i++){
    var c=new T.Mesh(new T.ConeGeometry(rs[i]*s,hs[i]*s,8),fm);c.position.y=ys[i]*s;c.castShadow=true;g.add(c);
  }
  t.castShadow=true;
  g.position.set(x,y,z);scene.add(g);
  var near=Math.hypot(x,z)<treeShadowR;
  g.traverse(function(o){if(o.isMesh)o.castShadow=near;});
}
function mkLeaf(x,z,s){
  var g=new T.Group(),y=groundY(x,z);
  var col=new T.Color(0x5f9a45).offsetHSL((rnd()-0.5)*0.05,0,(rnd()-0.5)*0.08);
  var t=new T.Mesh(new T.CylinderGeometry(0.16*s,0.24*s,2.4*s,6),new T.MeshLambertMaterial({color:0x66482f}));t.position.y=1.2*s;g.add(t);
  var f=new T.Mesh(new T.IcosahedronGeometry(1.7*s,1),new T.MeshLambertMaterial({color:col,flatShading:true}));f.position.y=3.5*s;g.add(f);
  var f2=new T.Mesh(new T.IcosahedronGeometry(1.1*s,1),new T.MeshLambertMaterial({color:col.clone().offsetHSL(0,0,0.04),flatShading:true}));
  f2.position.set(0.9*s,3.0*s,0.5*s);g.add(f2);
  g.position.set(x,y,z);scene.add(g);
  var near=Math.hypot(x,z)<treeShadowR;
  g.traverse(function(o){if(o.isMesh)o.castShadow=near;});
}
(function plant(){
  var i,row,x,z;
  // cortina de pinos contra los vientos del Oeste y del Sudoeste
  for(row=0;row<3;row++){
    for(z=-17+row*1.3;z<=15;z+=2.7){mkPine(9.5+row*2.1+(rnd()-0.5)*0.9,z+(rnd()-0.5)*0.8,0.95+rnd()*0.5);}
  }
  for(row=0;row<2;row++){
    for(x=1+row*1.4;x<=11;x+=2.8){mkPine(x+(rnd()-0.5)*0.9,-9.5-row*2.2+(rnd()-0.5)*0.8,0.95+rnd()*0.5);}
  }
  // árboles de hoja ancha lejos del frente Norte, para no tapar el sol de invierno
  [[-12,-6],[-14,-13],[-8,-16],[-17,2],[-10,-24]].forEach(function(q){mkLeaf(q[0],q[1],1.0+rnd()*0.4);});
  // dispersos
  var n=0,guard=0;
  while(n<70&&guard<600){
    guard++;
    var a=rnd()*Math.PI*2,r=26+rnd()*90;x=Math.sin(a)*r;z=Math.cos(a)*r;
    if(Math.hypot(x-LAKE.x,z-LAKE.z)<26)continue;
    if(z>3&&z<30&&Math.abs(x)<14)continue;
    if(rnd()<0.5)mkPine(x,z,0.9+rnd()*0.9);else mkLeaf(x,z,0.9+rnd()*0.7);
    n++;
  }
  // bosque lejano instanciado
  var im=new T.InstancedMesh(new T.ConeGeometry(3.2,10,6),new T.MeshLambertMaterial({color:0x2c5a37,flatShading:true}),220);
  var d=new T.Object3D(),col=new T.Color();
  for(i=0;i<220;i++){
    var aa=rnd()*Math.PI*2,rr=100+rnd()*95,xx=Math.sin(aa)*rr,zz=Math.cos(aa)*rr,s=0.8+rnd()*1.1;
    d.position.set(xx,groundY(xx,zz)+5*s,zz);d.scale.set(s,s,s);d.updateMatrix();im.setMatrixAt(i,d.matrix);
    col.setHSL(0.33+(rnd()-0.5)*0.04,0.38,0.2+rnd()*0.08);im.setColorAt(i,col);
  }
  scene.add(im);
  // arbustos del jardín
  var sm=new T.MeshLambertMaterial({color:0x4f8a3d,flatShading:true});
  [[-6.2,5.2],[-7.3,3.6],[6.6,5.6],[7.8,3.9],[-6.5,-2.4],[-6.6,1.4],[3.8,5.4]].forEach(function(q){
    var b=new T.Mesh(new T.IcosahedronGeometry(0.55+rnd()*0.25,1),sm);b.position.set(q[0],0.45,q[1]);b.castShadow=true;scene.add(b);
  });
})();

/* ---------- Casa ---------- */
var house=new T.Group();scene.add(house);
var gFloor=new T.Group(),gWallsExt=new T.Group(),gWallsInt=new T.Group(),gOpen=new T.Group(),gFurn=new T.Group(),gAlero=new T.Group(),gRoof=new T.Group();
[gFloor,gWallsExt,gWallsInt,gOpen,gFurn,gAlero,gRoof].forEach(function(g){house.add(g);});
var H=2.7;
var M={
  ext:new T.MeshLambertMaterial({color:0xece1cf}),
  int:new T.MeshLambertMaterial({color:0xf6f2ea}),
  slab:new T.MeshLambertMaterial({color:0xb7b2a8}),
  roof:new T.MeshLambertMaterial({color:0x6d5547}),
  ceil:new T.MeshLambertMaterial({color:0xfaf7f1,side:T.DoubleSide}),
  frame:new T.MeshLambertMaterial({color:0x2d3033}),
  door:new T.MeshLambertMaterial({color:0x7b4f32}),
  glass:new T.MeshStandardMaterial({color:0xa9d6ec,transparent:true,opacity:0.3,roughness:0.05,metalness:0,depthWrite:false,side:T.DoubleSide}),
  alero:new T.MeshLambertMaterial({color:0xd9d0c0})
};
function box(w,h,d,mat,x,y,z,parent,cast){
  var m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=cast!==false;m.receiveShadow=true;parent.add(m);return m;
}
// pared recta; axis 'x' (a lo largo de X, z fijo) o 'z' (a lo largo de Z, x fijo); ops con centro c, ancho w, y0, y1
function wall(axis,pos,a0,a1,t,ops,mat,parent){
  ops=ops.slice().sort(function(p,q){return p.c-q.c;});
  function put(len,h,mid,yc){
    if(len<=0.001||h<=0.001)return;
    if(axis==='x')box(len,h,t,mat,mid,yc,pos,parent);else box(t,h,len,mat,pos,yc,mid,parent);
  }
  var cur=a0;
  ops.forEach(function(o){

var LAT=-38.95*Math.PI/180;
var seasonDef={verano:{dec:-23.44,name:'Verano (dic.)'},equi:{dec:0,name:'Primavera / otoño'},invierno:{dec:23.44,name:'Invierno (jun.)'}};
var season='verano',hour=12;
var sunElev=0;
function updateSun(){
  var dec=seasonDef[season].dec*Math.PI/180,Hh=(hour-12)*15*Math.PI/180;
  var north=Math.cos(LAT)*Math.sin(dec)-Math.sin(LAT)*Math.cos(dec)*Math.cos(Hh);
  var east=-Math.cos(dec)*Math.sin(Hh);
  var up=Math.sin(LAT)*Math.sin(dec)+Math.cos(LAT)*Math.cos(dec)*Math.cos(Hh);
  var dir=new T.Vector3(-east,up,north).normalize(); // Este = -X, Norte = +Z
  sunElev=Math.asin(clamp(up,-1,1))*180/Math.PI;
  sunLight.position.copy(dir).multiplyScalar(80);
  sunBall.position.copy(dir).multiplyScalar(520);
  var day=smooth(-2,10,sunElev);
  sunLight.intensity=1.15*day;
  hemi.intensity=0.28+0.5*day;amb.intensity=0.14+0.16*day;
  sunBall.visible=sunElev>-3;
  var top=new T.Color(0x0a1530).lerp(new T.Color(0x3f86c9),day),bot=new T.Color(0x1a2438).lerp(new T.Color(0xcfe3ef),day);
  if(sunElev>0&&sunElev<12){bot.lerp(new T.Color(0xf2c9a0),0.35*(1-sunElev/12));}
  skyMat.uniforms.top.value.copy(top);skyMat.uniforms.bot.value.copy(bot);
  fogCol.copy(bot);scene.background=fogCol;
}

}

    tmp.copy(d.v).project(camera);
    if(tmp.z>1||tmp.z<-1||hidden){d.el.style.display='none';return;}
    d.el.style.display='block';
    d.el.style.left=((tmp.x*0.5+0.5)*w)+'px';d.el.style.top=((-tmp.y*0.5+0.5)*h)+'px';
  });
}

/* ---------- Potencia solar (cielo despejado) ---------- */
function powerAt(decDeg,h){
  var d=decDeg*Math.PI/180,Hh=(h-12)*15*Math.PI/180;
  var up=Math.sin(LAT)*Math.sin(d)+Math.cos(LAT)*Math.cos(d)*Math.cos(Hh);
  if(up<=0.02)return 0;
  var north=Math.cos(LAT)*Math.sin(d)-Math.sin(LAT)*Math.cos(d)*Math.cos(Hh);
  var el=Math.asin(up)*180/Math.PI;
  var am=1/(up+0.50572*Math.pow(el+6.07995,-1.6364));
  var dni=1353*Math.pow(0.7,Math.pow(am,0.678));
  var cosI=Math.max(0,up*Math.cos(ROOF_TH)+north*Math.sin(ROOF_TH));
  var poa=dni*cosI+0.1*dni*up*(1+Math.cos(ROOF_TH))/2;
  return panelArea*PANEL.eff*PANEL.pr*poa/1000;
}
function dailyKWh(decDeg){var e=0;for(var h=0;h<24;h+=0.1)e+=powerAt(decDeg,h)*0.1;return e;}
var kWp=panelArea*PANEL.eff;
function f2(v){return v.toFixed(2).replace('.',',');}
var pwHost=document.getElementById('power'),pwTime=document.getElementById('pwTime'),pwEls={};
Object.keys(seasonDef).forEach(function(k){
  var box=document.createElement('div');box.className='pw';
  var kk=document.createElement('div');kk.className='k';kk.textContent={verano:'Verano',equi:'Equinoccio',invierno:'Invierno'}[k];
  var v=document.createElement('div');v.className='v';var vn=document.createTextNode('0,00');var sm=document.createElement('small');sm.textContent='kW';v.appendChild(vn);v.appendChild(sm);
  var bar=document.createElement('div');bar.className='bar';var bi=document.createElement('i');bar.appendChild(bi);
  var dd=document.createElement('div');dd.className='d';dd.textContent=f2(dailyKWh(seasonDef[k].dec))+' kWh/día';
  [kk,v,bar,dd].forEach(function(n){box.appendChild(n);});pwHost.appendChild(box);
  pwEls[k]={box:box,vn:vn,bi:bi};
});
function updatePower(){
  Object.keys(seasonDef).forEach(function(k){
    var p=powerAt(seasonDef[k].dec,hour),e=pwEls[k];
    e.vn.nodeValue=f2(p);e.bi.style.width=clamp(p/kWp*100,0,100).toFixed(1)+'%';e.box.classList.toggle('on',k===season);
  });
  pwTime.textContent='a las '+fmtHour(hour)+(roofOn?'':' · techo retirado');
}

/* ---------- Panel ---------- */
var infoT=document.getElementById('infoT'),infoP=document.getElementById('infoP');
function setInfo(t,p){infoT.textContent=t;infoP.textContent=p;}
var viewsHost=document.getElementById('views');
views.forEach(function(v){
  var b=document.createElement('button');b.type='button';b.className='chip'+(v.id==='general'?' on':'');b.dataset.id=v.id;b.textContent=v.n;
  b.addEventListener('click',function(){goView(v);});viewsHost.appendChild(b);
});

var toolsHost=document.getElementById('tools');
var state={roof:true,alero:true,paredes:true,muebles:true,nombres:false,aire:false,paneles:true};
var toolDefs=[
  {k:'roof',n:'Techo',big:1,t:'Techo',on:'Techo puesto: se ve la casa terminada. Con el techo puesto el interior recibe sol solo por las ventanas.',off:'Techo retirado: se ve la distribución y cómo entra el sol a cada ambiente. Volvé a tocar el botón para colocarlo.'},
  {k:'alero',n:'Alero',t:'Alero horizontal',on:'El alero sobre las ventanas Norte controla la radiación según la estación: en verano el sol alto queda afuera y en invierno el sol bajo pasa por debajo.',off:'Sin alero se ve cómo el sol de verano entra directo por las ventanas Norte y puede recalentar el living.'},
  {k:'paneles',n:'Paneles',t:'Paneles solares',on:'12 paneles de 1,7 m² (unos 20 m², cerca de 4 kWp) sobre el faldón Norte del techo, la cara que mejor mira al sol. Abajo se ve la potencia estimada en cada estación.',off:'Paneles ocultos. La potencia se sigue calculando con el mismo techo.'},
  {k:'paredes',n:'Paredes',t:'Muros exteriores',on:'Muros y aberturas visibles.',off:'Sin muros exteriores quedan a la vista los tabiques interiores y los muebles.'},
  {k:'muebles',n:'Muebles',t:'Muebles',on:'Muebles visibles para dar escala a cada ambiente.',off:'Sin muebles se ven mejor los pisos y los recorridos del sol.'},
  {k:'nombres',n:'Nombres',t:'Nombres de ambientes',on:'Etiquetas activas: ambientes y elementos bioclimáticos.',off:'Etiquetas ocultas.'},
  {k:'aire',n:'Aire',wind:1,t:'Flujos de aire',on:'Flechas celestes: viento del Oeste y Sudoeste. Puntos azules a naranjas: el aire fresco entra por abajo, se calienta y sale por la abertura superior del techo (efecto chimenea). La ventilación cruzada se usa en verano; en invierno las aberturas se cierran.',off:'Flujos de aire ocultos.'}
];
var toolBtns={};
toolDefs.forEach(function(d){
  var b=document.createElement('button');b.type='button';b.className='chip'+(d.big?' big':'')+(d.wind?' wind':'');b.textContent=d.n;
  b.setAttribute('aria-pressed','true');
  b.addEventListener('click',function(){
    state[d.k]=!state[d.k];
    if(d.k==='roof')setRoof(state.roof);
    applyState();syncTools();setInfo(d.t,state[d.k]?d.on:d.off);
  });
  toolsHost.appendChild(b);toolBtns[d.k]=b;
});
function syncTools(){
  state.roof=roofOn;
  toolDefs.forEach(function(d){var on=state[d.k];toolBtns[d.k].classList.toggle('on',on);toolBtns[d.k].setAttribute('aria-pressed',on?'true':'false');});
  toolBtns.roof.textContent=state.roof?'Sacar techo':'Poner techo';
}
function applyState(){
  gAlero.visible=state.alero;gPanels.visible=state.paneles;gWallsExt.visible=state.paredes;gOpen.visible=state.paredes;gFurn.visible=state.muebles;
  showLabels=state.nombres;gAir.visible=state.aire;
}

var seasonHost=document.getElementById('seasons'),hourIn=document.getElementById('hour'),hourOut=document.getElementById('hourOut');
Object.keys(seasonDef).forEach(function(k){
  var b=document.createElement('button');b.type='button';b.className='chip'+(k===season?' on':'');b.dataset.k=k;
  b.textContent={verano:'Verano',equi:'Equinoccio',invierno:'Invierno'}[k];
  b.addEventListener('click',function(){season=k;refreshSun(true);});seasonHost.appendChild(b);
});
function fmtHour(h){var hh=Math.floor(h),mm=Math.round((h-hh)*60);if(mm===60){hh++;mm=0;}return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;}
function refreshSun(describe){
  updateSun();updatePower();
  hourOut.textContent=fmtHour(hour);
  Array.prototype.forEach.call(seasonHost.children,function(b){b.classList.toggle('on',b.dataset.k===season);});
  if(describe){
    var noon=(function(){var d=seasonDef[season].dec*Math.PI/180;return Math.asin(Math.sin(LAT)*Math.sin(d)+Math.cos(LAT)*Math.cos(d))*180/Math.PI;})();
    var msg={
      verano:'El sol del mediodía llega a unos '+Math.round(noon)+'° de altura: el alero tapa el vidrio Norte y evita el sobrecalentamiento.',
      equi:'El sol del mediodía llega a unos '+Math.round(noon)+'° de altura: el alero sombrea solo la parte alta de las ventanas.',
      invierno:'El sol del mediodía llega a unos '+Math.round(noon)+'° de altura: pasa por debajo del alero, entra por el Norte y calienta el piso del living.'
    }[season];
    setInfo(seasonDef[season].name,msg+' Sacá el techo para ver el sol adentro.');
  }
}
var playing=false,playBtn=document.getElementById('play');
function setPlaying(v){playing=v;playBtn.classList.toggle('on',v);playBtn.setAttribute('aria-pressed',v?'true':'false');playBtn.textContent=v?'Pausar':'Reproducir día';}
playBtn.addEventListener('click',function(){setPlaying(!playing);});
hourIn.addEventListener('input',function(){setPlaying(false);hour=parseFloat(hourIn.value);refreshSun(false);});
hour=parseFloat(hourIn.value);

var dock=document.getElementById('dock'),grab=document.getElementById('grab');
grab.addEventListener('click',function(){
  var c=dock.classList.toggle('collapsed');
  grab.textContent=c?'Mostrar panel ⌃':'Ocultar panel ⌄';grab.setAttribute('aria-expanded',c?'false':'true');
});

/* ---------- Ciclo ---------- */
var needle=document.getElementById('needle');
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();
var clock=new T.Clock();
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),0.1);
  if(playing){hour+=dt*(RM?0:1.1);if(hour>20)hour=4;hourIn.value=hour;refreshSun(false);}
  updateTween(dt);controls.update();updateRoof(dt);updateAir(dt);updateLabels();
  var az=Math.atan2(camera.position.x-controls.target.x,camera.position.z-controls.target.z)*180/Math.PI;
  needle.style.transform='rotate('+(180+az).toFixed(1)+'deg)';
  renderer.render(scene,camera);
}
camera.position.set(14,8.5,19);controls.target.set(0,1.2,0);controls.update();
applyState();syncTools();refreshSun(false);setInfo(views[0].t,views[0].p);
loop();
})();
</script>
